# Mosquitto 2.x configuration for ICU Fusion.
# __BROKER_DIR__ is replaced with the absolute broker/ path by start.sh,
# which renders this file to /tmp/icu-mosquitto.conf.

per_listener_settings false
allow_anonymous false
password_file __BROKER_DIR__/passwd

persistence true
persistence_location __BROKER_DIR__/data/
autosave_interval 30

# MQTT over TCP: Pi nodes, fake node, Flask logger
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets: browser dashboard
listener 9001 0.0.0.0
protocol websockets

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %H:%M:%S
