# Mosquitto 2.x configuration for ICU Fusion

# Security
allow_anonymous false
password_file passwd

# Persistence
persistence true
persistence_location data/
persistence_file mosquitto.db

# Listeners
# Listener on port 1883 (MQTT) for all interfaces (Raspberry Pi nodes, sim, logger)
listener 1883

# Listener on port 9001 (MQTT over WebSockets) for browser dashboard
listener 9001
protocol websockets

# Logging
log_dest stdout

